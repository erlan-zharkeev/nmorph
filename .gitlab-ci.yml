image: node:18.13.0

stages:
  - build
  - deploy

cache:
  paths:
    - lib-docs/node_modules/

build-docs:
  stage: build
  script:
    - cd lib-docs
    - npm install
    - npm run build
    - npm run generate
  artifacts:
    paths:
      - lib-docs/public/
  only:
    - dev

deploy-docs:
  stage: deploy
  script:
    - cd lib-docs
    - mv public public/
    - ls -l  # Для проверки содержимого папки перед деплоем
  artifacts:
    paths:
      - lib-docs/public
  only:
    - dev

