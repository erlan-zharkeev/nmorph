image: node:20.19.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

stages:
  - release
  - build
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - lib-docs/node_modules/

variables:
  NODE_ENV: production

build-docs:
  stage: build
  before_script:
    - rm -rf lib-docs/node_modules
  script:
    - cd lib-docs
    - npm ci --ignore-scripts
    - npm install --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - npm run postinstall
    - npm run generate
  artifacts:
    paths:
      - lib-docs/.output/public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

pages:
  stage: deploy
  dependencies:
    - build-docs
  script:
    - mv lib-docs/.output/public public/
    - ls -l public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

publish:
  stage: release
  variables:
    NODE_ENV: development
    NPM_CONFIG_PRODUCTION: "false"
  before_script:
    - rm -rf library/node_modules
  script:
    - cd library
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "NPM_TOKEN is empty. If the variable is marked Protected, the main branch must also be protected in GitLab."
        exit 1
      fi
    - |
      echo "NPM_TOKEN diagnostics"
      echo "length=${#NPM_TOKEN}"
      if [ "${NPM_TOKEN#npm_}" != "$NPM_TOKEN" ]; then
        echo "starts_with_npm_prefix=true"
      else
        echo "starts_with_npm_prefix=false"
      fi
      if printf '%s' "$NPM_TOKEN" | grep -q '[[:space:]]'; then
        echo "contains_whitespace=true"
      else
        echo "contains_whitespace=false"
      fi
      echo "sha256=$(printf '%s' "$NPM_TOKEN" | sha256sum | awk '{print $1}')"
    - npm ci --include=dev --ignore-scripts
    - npm install --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || true)
    - |
      if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
        echo "Version $PACKAGE_VERSION is already published for $PACKAGE_NAME. Skipping publish."
        exit 0
      fi
    - printf "@nmorph:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > ~/.npmrc
    - sed 's#//registry.npmjs.org/:_authToken=.*#//registry.npmjs.org/:_authToken=[REDACTED]#' ~/.npmrc
    - npm whoami --registry=https://registry.npmjs.org/
    - npm run build
    - npm pack --dry-run
    - npm publish --access public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never
