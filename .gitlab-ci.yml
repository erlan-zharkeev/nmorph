image: node:20.19.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

stages:
  - release
  - build
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - .pnpm-store/

variables:
  NODE_ENV: production
  PNPM_VERSION: "10.33.0"

.pnpm_setup:
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store

build-docs:
  stage: build
  extends: .pnpm_setup
  script:
    - pnpm install --frozen-lockfile --prod=false --ignore-scripts
    - pnpm --filter @nmorph/nmorph-ui-kit build
    - pnpm --filter nmorph-lib-docs exec nuxt prepare
    - pnpm --filter nmorph-lib-docs generate
  artifacts:
    paths:
      - lib-docs/.output/public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

pages:
  stage: deploy
  dependencies:
    - build-docs
  script:
    - mv lib-docs/.output/public public/
    - ls -l public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

publish:
  stage: release
  image: node:24
  extends: .pnpm_setup
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    NODE_ENV: development
    NPM_CONFIG_PRODUCTION: "false"
  script:
    - |
      if [ -z "$NPM_ID_TOKEN" ]; then
        echo "NPM_ID_TOKEN is empty. Trusted publishing requires GitLab.com shared runners and a configured Trusted Publisher on npmjs.com."
        exit 1
      fi
    - pnpm install --frozen-lockfile --prod=false --ignore-scripts
    - pnpm --filter @nmorph/nmorph-ui-kit build
    - cd library
    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
    - |
      if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
        echo "Version $PACKAGE_VERSION is already published for $PACKAGE_NAME. Skipping publish."
        exit 0
      fi
    - npm pack --dry-run
    - npm publish --access public --registry=https://registry.npmjs.org/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "production"'
    - when: never
