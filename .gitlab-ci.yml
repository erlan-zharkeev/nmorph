image: node:20.19.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

stages:
  - build
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - lib-docs/node_modules/

variables:
  NODE_ENV: production

build-docs:
  stage: build
  before_script:
    - rm -rf lib-docs/node_modules
  script:
    - cd lib-docs
    - npm ci --ignore-scripts
    - npm install --no-save @rollup/rollup-linux-x64-gnu
    - npm run postinstall
    - npm run generate
  artifacts:
    paths:
      - lib-docs/.output/public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

pages:
  stage: deploy
  dependencies:
    - build-docs
  script:
    - mv lib-docs/.output/public public/
    - ls -l public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never
