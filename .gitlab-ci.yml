image: node:18

stages:
  - build
  - deploy

cache:
  paths:
    - lib-docs/node_modules/

build-docs:
  stage: build
  script:
    - cd lib-docs
    - npm install
    - npm run build
    - npm run generate
  artifacts:
    paths:
      - lib-docs/dist
  only:
    - dev

deploy-docs:
  stage: deploy
  script:
    - cd lib-docs
    - mv dist public  # Предполагаем, что генерация собирает файлы в папку dist
    - ls -l  # Для проверки содержимого папки перед деплоем
  artifacts:
    paths:
      - lib-docs/public  # Сохраняем папку public как артефакт
  only:
    - dev
