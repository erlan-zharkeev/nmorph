image: node:20.19.0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

stages:
  - release
  - build
  - deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - lib-docs/node_modules/

variables:
  NODE_ENV: production

build-docs:
  stage: build
  before_script:
    - rm -rf lib-docs/node_modules
  script:
    - cd lib-docs
    - npm ci --ignore-scripts
    - npm install --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - npm run postinstall
    - npm run generate
  artifacts:
    paths:
      - lib-docs/.output/public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

pages:
  stage: deploy
  dependencies:
    - build-docs
  script:
    - mv lib-docs/.output/public public/
    - ls -l public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - when: never

publish:
  stage: release
  image: node:24
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    NODE_ENV: development
    NPM_CONFIG_PRODUCTION: "false"
  before_script:
    - rm -rf library/node_modules
  script:
    - cd library
    - |
      if [ -z "$NPM_ID_TOKEN" ]; then
        echo "NPM_ID_TOKEN is empty. Trusted publishing requires GitLab.com shared runners and a configured Trusted Publisher on npmjs.com."
        exit 1
      fi
    - npm ci --include=dev --ignore-scripts
    - npm install --no-save @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
    - |
      if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
        echo "Version $PACKAGE_VERSION is already published for $PACKAGE_NAME. Skipping publish."
        exit 0
      fi
    - npm run build
    - npm pack --dry-run
    - npm publish --access public --registry=https://registry.npmjs.org/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - when: never
