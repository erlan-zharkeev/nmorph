name: Deploy docs

on:
  push:
    branches:
      - production
      - main
  pull_request:
    branches:
      - production
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  NODE_VERSION: 20.19.0
  PNPM_VERSION: 10.33.0
  NUXT_APP_BASE_URL: /nmorph/
  NUXT_PUBLIC_SITE_URL: https://erlan-zharkeev.github.io/nmorph/

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false --ignore-scripts

      - name: Build library
        run: pnpm --filter @nmorph/nmorph-ui-kit build

      - name: Prepare docs
        run: pnpm --filter nmorph-lib-docs exec nuxt prepare

      - name: Generate docs
        run: pnpm --filter nmorph-lib-docs generate

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: lib-docs/.output/public

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
